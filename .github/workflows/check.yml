name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 内链、讲义结构、目录收录、零依赖、demo 冒烟，全在这一个脚本里。
      # 本地怎么跑，CI 就怎么跑 —— 不维护两套标准。
      - name: 自检
        run: python scripts/check.py
